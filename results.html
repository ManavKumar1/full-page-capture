<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Full Page Capture</title>
<link rel="stylesheet" href="styles.css" />
<link rel="icon" href="icons/icon32.png" />
<style>
  html, body { height: 100%; background: var(--paper-2); }
  .app { display: flex; flex-direction: column; height: 100vh; }

  /* ---- top toolbar ---- */
  .toolbar {
    background: var(--ink);
    color: var(--ink-text);
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 0 14px;
    height: 56px;
    flex-shrink: 0;
    border-bottom: 1px solid var(--line-on-ink);
    z-index: 20;
  }
  .toolbar .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .toolbar .brand img { width: 22px; height: 22px; border-radius: 5px; flex-shrink: 0; }
  .toolbar .meta { min-width: 0; }
  .toolbar .meta .t {
    font-size: 12.5px; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 320px;
  }
  .toolbar .meta .d { font-size: 10.5px; color: var(--ink-text-muted); }
  .toolbar .spacer { flex: 1; }
  .toolbar .group { display: flex; align-items: center; gap: 2px; }
  .toolbar .divider { width: 1px; height: 22px; background: var(--line-on-ink); margin: 0 6px; }

  /* ---- edit sub-toolbar ---- */
  .edit-bar {
    display: none;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    background: var(--ink-2);
    border-bottom: 1px solid var(--line-on-ink);
    flex-shrink: 0;
  }
  .edit-bar.is-visible { display: flex; }
  .edit-bar .tools { display: flex; gap: 2px; }
  .edit-bar .swatches { display: flex; gap: 6px; }
  .swatch {
    width: 20px; height: 20px; border-radius: 50%;
    border: 2px solid transparent; cursor: pointer;
  }
  .swatch.is-active { border-color: #fff; }
  .edit-bar .spacer { flex: 1; }
  .edit-hint { font-size: 11px; color: var(--ink-text-muted); }

  /* ---- canvas stage ---- */
  .stage {
    flex: 1;
    overflow: auto;
    display: flex;
    justify-content: center;
    padding: 32px;
  }
  .canvas-wrap {
    position: relative;
    height: fit-content;
    box-shadow: var(--shadow-card);
    background: #fff;
    line-height: 0;
  }
  .canvas-wrap canvas { display: block; }
  #overlayCanvas { position: absolute; top: 0; left: 0; cursor: crosshair; }

  .state-msg {
    margin: auto;
    text-align: center;
    color: var(--paper-text-muted);
    font-size: 13px;
  }
  .state-msg .spinner {
    width: 22px; height: 22px; margin: 0 auto 12px;
    border-radius: 50%;
    border: 2.5px solid var(--line-on-paper);
    border-top-color: var(--safelight);
    animation: gfp-spin 0.8s linear infinite;
  }

  /* ---- zoom bar ---- */
  .zoombar {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 4px;
    background: var(--ink);
    color: var(--ink-text);
    border-radius: 999px;
    padding: 6px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
    z-index: 15;
  }
  .zoombar button { border-radius: 999px; }
  .zoombar .pct {
    font-family: var(--font-mono);
    font-size: 11.5px;
    width: 48px;
    text-align: center;
    cursor: pointer;
  }

  .toast {
    position: fixed;
    top: 66px;
    left: 50%;
    transform: translateX(-50%) translateY(-8px);
    background: var(--ink);
    color: var(--ink-text);
    font-size: 12.5px;
    padding: 9px 16px;
    border-radius: 999px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.18s ease, transform 0.18s ease;
    z-index: 30;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .toast.is-visible { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--signal); }
</style>
</head>
<body>
<div class="app">
  <div class="toolbar">
    <div class="brand">
      <img src="icons/icon48.png" alt="" />
      <div class="meta">
        <div class="t" id="pageTitle">Loading…</div>
        <div class="d mono" id="pageDims">—</div>
      </div>
    </div>
    <div class="spacer"></div>
    <div class="group">
      <button class="icon-btn" id="editBtn" title="Edit / annotate">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
      </button>
      <button class="icon-btn" id="copyBtn" title="Copy image">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      </button>
      <div class="divider"></div>
      <button class="icon-btn" id="downloadPngBtn" title="Download PNG">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      </button>
      <button class="icon-btn" id="downloadPdfBtn" title="Download PDF">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8Z"/><polyline points="14 2 14 8 20 8"/><text x="6.2" y="18.5" font-family="monospace" font-size="7" fill="currentColor" stroke="none">PDF</text></svg>
      </button>
      <div class="divider"></div>
      <button class="icon-btn" id="historyBtn" title="All captures">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      </button>
      <button class="icon-btn" id="settingsBtn" title="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
      <div class="divider"></div>
      <button class="icon-btn" id="deleteBtn" title="Delete capture">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/></svg>
      </button>
    </div>
  </div>

  <div class="edit-bar" id="editBar">
    <div class="tools">
      <button class="icon-btn is-active" id="toolPen" data-tool="pen" title="Pen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="M2 2l7.586 7.586"/><circle cx="11" cy="11" r="2"/></svg>
      </button>
      <button class="icon-btn" id="toolRect" data-tool="rect" title="Rectangle">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/></svg>
      </button>
      <button class="icon-btn" id="toolArrow" data-tool="arrow" title="Arrow">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="19" x2="19" y2="5"/><polyline points="9 5 19 5 19 15"/></svg>
      </button>
      <button class="icon-btn" id="toolText" data-tool="text" title="Text">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 7 4 4 20 4 20 7"/><line x1="9" y1="20" x2="15" y2="20"/><line x1="12" y1="4" x2="12" y2="20"/></svg>
      </button>
    </div>
    <div class="divider"></div>
    <div class="swatches" id="swatches"></div>
    <div class="divider"></div>
    <button class="icon-btn" id="undoBtn" title="Undo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M3 13a9 9 0 1 0 3-7"/></svg>
    </button>
    <button class="icon-btn" id="clearBtn" title="Clear all">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><polyline points="3 6 5 6 21 6"/></svg>
    </button>
    <span class="spacer"></span>
    <span class="edit-hint">Draw on the image, then save to bake it in.</span>
    <button class="btn btn-ghost-on-ink" id="cancelEditBtn">Cancel</button>
    <button class="btn btn-primary" id="saveEditBtn">Save annotations</button>
  </div>

  <div class="stage thin-scroll" id="stage">
    <div class="state-msg" id="stateMsg">
      <div class="spinner"></div>
      <div id="stateText">Stitching your screenshot together…</div>
    </div>
  </div>

  <div class="zoombar" id="zoombar" style="display:none;">
    <button class="icon-btn" id="zoomOutBtn" title="Zoom out">−</button>
    <span class="pct mono" id="zoomPct" title="Reset to fit">100%</span>
    <button class="icon-btn" id="zoomInBtn" title="Zoom in">+</button>
  </div>

  <div class="toast" id="toast"><span class="dot"></span><span id="toastText">Saved</span></div>
</div>

<script src="lib/jspdf.umd.min.js"></script>
<script src="results.js"></script>
</body>
</html>
